name: Ticket Tracker

on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: 'Send a test email to verify delivery'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

env:
  EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
  EMAIL_FROM: ${{ secrets.EMAIL_FROM || secrets.EMAIL_ADDRESS }}
  APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
  PRICE_FILE: prices.json
  SEND_TEST_EMAIL: ${{ inputs.send_test_email || vars.SEND_TEST_EMAIL || 'false' }}
  TICKETMASTER_URL: https://www.ticketmaster.com/league-of-legends-world-championships-brooklyn-new-york-11-14-2026/event/300064EA0334EE28?referrer=https%3A%2F%2Fwww.ticketmaster.com%2Fleague-of-legends-world-championships-tickets%2Fartist%2F1906735
  STUBHUB_URL: https://www.stubhub.com/league-of-legends-world-championship-brooklyn-tickets-11-14-2026/event/161251368/?backUrl=%2Fleague-of-legends-world-championship-tickets%2Fgrouping%2F150363310&lt=45.791&lg=-122.529&quantity=1
  SEATGEEK_URL: https://seatgeek.com/league-of-legends-tickets/esports/2026-11-14-12-pm/18390890?quantity=1

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore tracker state
        uses: actions/cache@v4
        with:
          path: prices.json
          key: ticket-tracker-state

      - name: Prepare tracker state
        run: |
          mkdir -p .
          if [ ! -f prices.json ]; then echo '{}' > prices.json; fi

      - name: Run tracker
        run: |
          echo "SEND_TEST_EMAIL=${SEND_TEST_EMAIL}"
          echo "EMAIL_ADDRESS_SET=${EMAIL_ADDRESS:+set}"
          echo "EMAIL_FROM_SET=${EMAIL_FROM:+set}"
          echo "APP_PASSWORD_SET=${APP_PASSWORD:+set}"
          echo "TICKETMASTER_URL_SET=${TICKETMASTER_URL:+set}"
          echo "STUBHUB_URL_SET=${STUBHUB_URL:+set}"
          echo "SEATGEEK_URL_SET=${SEATGEEK_URL:+set}"
          echo "Running tracker with SEND_TEST_EMAIL=${SEND_TEST_EMAIL}"
          python main.py

      - name: Save tracker state
        uses: actions/cache@v4
        with:
          path: prices.json
          key: ticket-tracker-state
